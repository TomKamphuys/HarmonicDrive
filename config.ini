[nfs]
audio = audio
plugins = plugins
motion_manager = motion_manager

[scanner]
controller = grbl_streamer
feed_rate = 35000 # limit feed rate for arc moves

[plugins]
plugin_1 = nfs.plugins.cylindrical_measurement_points
plugin_2 = nfs.plugins.spherical_measurement_points
plugin_3 = nfs.plugins.spherical_measurement_points_sorted
plugin_4 = nfs.plugins.spherical_measurement_points_arcs
plugin_5 = nfs.plugins.spherical_measurement_points_arcs_random
plugin_6 = nfs.plugins.file_measurement_points

[grbl_streamer]
type = Mock  # Arduino
set_config = False
grbl_x_axis_config = grbl_x_axis
grbl_y_axis_config = grbl_y_axis
grbl_z_axis_config = grbl_z_axis
baudrate = 115200

[windows]
port = COM9

;[grbl_x_axis]
;steps_per_millimeter = 1  # 400  # steps/mm
;maximum_rate = 5000  # 11160  # mm/min
;acceleration = 600  # 100  # mm/sec^2
;
;[grbl_y_axis]
;steps_per_millimeter = 1  # 40  # steps/mm
;maximum_rate = 5000  # mm/min
;acceleration = 600  # 100  # mm/sec^2
;
;[grbl_z_axis]
;steps_per_millimeter = 1  # 600  # steps/degrees
;maximum_rate = 5000  # 700  # degrees/min
;acceleration = 600 # 10  # degrees/sec^2

[grbl_x_axis]
steps_per_millimeter = 400  # steps/mm
maximum_rate = 500  # 1160  # mm/min
acceleration = 100  # mm/sec^2

[grbl_y_axis]
steps_per_millimeter = 40  # steps/mm
maximum_rate = 5000  # mm/min
acceleration = 10  # 100  # mm/sec^2

[grbl_z_axis]
steps_per_millimeter = 600  # steps/degrees
maximum_rate = 700  # degrees/min
acceleration = 10  # degrees/sec^2

[audio]
mock = False
device_id = 1,3
pre_sweeps = 1
measurement_sweeps = 4
save_raw_measurement = True

[sweep]
type = ExponentialSweep
sampling_rate = 44100  # Hz
minimum_frequency = 20  # Hz
maximum_frequency = 20000  # Hz
duration = 0.5  # s
padding_time = 0.3  # s

[motion_manager]
type = CylindricalMeasurementMotionManager  # SphericalMeasurementMotionManager
measurement_points = measurement_points
safe_radius = 87  # mm


[measurement_points]
type = FileMeasurementPoints
filename = jan_cylinder_grid1.csv
homing_gap = 10  # degrees
pole_gap = 60  # mm diameter

[measurement_points_sph]
type = SphericalMeasurementPointsArcsRandom
nr_of_points = 2000
wall_spacing = 10  # mm
radius = 300 # mm
homing_gap = 10  # degrees
pole_gap = 60  # mm diameter
