[nfs]
audio = audio
plugins = plugins
motion_manager = motion_manager

[scanner]
controller = grbl_streamer
feed_rate = 35000

[motion_manager]
type = CylindricalMeasurementMotionManager
measurement_points = cylindrical_grid
safe_radius = 100.0

[cylindrical_grid]
# fix 1 = Type must match "FileMeasurementPoints" exactly as defined in the python file
type = FileMeasurementPoints
# fix 2 = The code expects "filename", not "file_name"
filename = jan_cylinder_grid1.csv
# fix 3 = These two parameters are mandatory in the python code.
# we set them to 0.0 to ensure no points are filtered out.
homing_gap = 0.0
pole_gap = 0.0

[plugins]
plugin_1 = nfs.plugins.cylindrical_measurement_points
plugin_2 = nfs.plugins.spherical_measurement_points
plugin_3 = nfs.plugins.spherical_measurement_points_sorted
plugin_4 = nfs.plugins.spherical_measurement_points_arcs
plugin_5 = nfs.plugins.spherical_measurement_points_arcs_random
plugin_6 = nfs.plugins.file_measurement_points

[grbl_streamer]
type = Mock
set_config = False
grbl_x_axis_config = grbl_x_axis
grbl_y_axis_config = grbl_y_axis
grbl_z_axis_config = grbl_z_axis
baudrate = 115200

[windows]
port = COM9

[grbl_x_axis]
steps_per_millimeter = 400
maximum_rate = 500
acceleration = 100

[grbl_y_axis]
steps_per_millimeter = 40
maximum_rate = 5000
acceleration = 10

[grbl_z_axis]
steps_per_millimeter = 600
maximum_rate = 5000
acceleration = 100

# ─────────────────────────────────────────────────────────────────────────────
#  AUDIO & SWEEP CONFIGURATION
#  Matched to new audio.py requirements
# ─────────────────────────────────────────────────────────────────────────────
[audio]
mock = False

# -- Device Selection --
# Input and Output Device Indices (ASIO preferred)
IN_DEV  = 21
OUT_DEV = 21

# -- Channel Mapping (0-based for ASIO) --
IN_CH_MIC   = 0
IN_CH_LOOP  = 1
OUT_CH_SPKR = 0
OUT_CH_REF  = 1

# -- Audio Driver Settings --
FS               = 48000        # Sampling Rate (Hz)
BLOCKSIZE        = 2048         # Buffer size (Match ASIO panel if using ASIO)
WASAPI_EXCLUSIVE = True         # Only applies if using WASAPI
# ─────────────────────────────────────────────────────────────────────────────

[sweep]
# -- Sweep Signal Parameters --
SWEEP_DUR_S      = 6.0          # Duration of the sine sweep (seconds)
SWEEP_LEVEL_DBFS = -3.0         # Playback level (dB Full Scale)
NUM_SWEEPS       = 2            # Number of sweeps to average per point
F1_HZ            = 1000         # Start Freq. "None" = Auto (1Hz or calculated safe min)

# -- PROTECTION FILTER (New Feature) --
PROTECT_HPF_HZ = 1000.0 # Corner frequency in Hz (use 'None' to disable)
PROTECT_HPF_ORDER = 1 # Slope order (1, 2, 3, or 4)
PROTECT_HPF_PHASE = LIN # Phase mode: 'MIN' (Minimum Phase) or 'LIN' (Linear Phase)

# -- Latency & Alignment (Barker Marker) --
MARKER_DUR_MS         = 500.0   # Duration of the alignment marker
MARKER_BW_HZ          = (500, 5000) # Bandwidth for the marker (Low, High)
ALIGN_TO_FIRST_MARKER = True    # True = Fixed timing relative to 1st marker # False = Resync every sweep

# -- Timing & Padding --
PRE_SIL_MS        = 500.0       # Silence before measurement starts (settling time)
POST_SIL_MS       = 500.0       # Silence after sweep (catch reverb tail)
MIC_TAIL_TAPER_MS = 20.0        # Short fade-out to suppress DC/noise at end of capture

# -- Debugging --
DEBUG_SAVES = True              # Save raw components (loopback, ref, raw mic) to 'Recordings/debug'

# -- Distortion Injection Test --
# Set to None for normal operation. Set to dB value (e.g. -20.0) to inject harmonics.
H2_TEST_DB = None #-15
H3_TEST_DB = None #-30